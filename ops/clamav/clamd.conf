# Custyard private attachment scanner. Keep this file in sync with the scanner
# deployment runbook; no customer files are mounted into this container.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
PidFile /run/clamav/clamd.pid

# /init waits for this socket; FreshClam uses it to notify database reloads.
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes

# Fly 6PN supplies private IPv6 transport. No public Fly services or IPs.
TCPSocket 3310
TCPAddr ::
# Fly's machine health probe connects over the guest's private IPv4 interface.
TCPAddr 0.0.0.0

# Stream bytes over the private network; do not log scanned content or clean
# filenames. Keep daemon diagnostics in container logs.
# Foreground logging goes to stdout; LogFile cannot target /dev/stdout
# because ClamAV rejects symlink log destinations.
LogTime yes
LogClean no
LogVerbose no

# Bound CPU, memory, connections, archive expansion and scanner execution.
MaxThreads 2
MaxQueue 4
MaxConnectionQueueLength 16
CommandReadTimeout 10
ReadTimeout 30
SendBufTimeout 500
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 10000
BytecodeSecurity TrustSigned
BytecodeTimeout 5000

# Inspection that cannot finish must never silently appear clean.
AlertEncrypted yes
AlertExceedsMax yes
FailIfCvdOlderThan 7

# Retain availability while a new engine loads. The VM has 4 GiB for both
# copies during reload. FreshClam runs continuously and notifies this daemon.
ConcurrentDatabaseReload yes
SelfCheck 600
