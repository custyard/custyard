# Private ClamAV daemon, reached through Flycast so Fly Proxy can start the
# Machine on demand and stop it when idle. The app holds one private IPv6
# address only; never allocate a public IP (deploy with --no-public-ips).
app = "custyard-scanner"
org = "custyard"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
# Resolve and retain the immutable registry digest when deploying this release.
image = "clamav/clamav@sha256:96ba6697d9a7479baff0a03dedceb96e8c18d28f180fb0ed0046f935e6b90382"

[env]
CLAMAV_NO_CLAMD = "false"
CLAMAV_NO_FRESHCLAMD = "false"
CLAMAV_NO_MILTERD = "true"
CLAMD_STARTUP_TIMEOUT = "900"
FRESHCLAM_CHECKS = "24"

[processes]
# Update signatures before clamd loads them, then run the image's /init.
app = "sh /etc/clamav/custyard-start.sh"

[[files]]
guest_path = "/etc/clamav/clamd.conf"
local_path = "ops/clamav/clamd.conf"

[[files]]
guest_path = "/etc/clamav/custyard-start.sh"
local_path = "ops/clamav/start.sh"

# Raw TCP on the private Flycast address. No handlers: clamd speaks its own
# protocol. Scans arrive at custyard-scanner.flycast:3310.
[[services]]
processes = ["app"]
internal_port = 3310
protocol = "tcp"
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[services.ports]]
port = 3310

[[mounts]]
source = "clamav_signatures"
destination = "/var/lib/clamav"

[[vm]]
cpu_kind = "shared"
cpus = 2
memory = "4gb"

[checks]
[checks.clamd]
type = "tcp"
port = 3310
interval = "30s"
timeout = "5s"
grace_period = "10m"
