<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- Custyard Logo (Dark Mode): Shield icon + wordmark -->
  <g transform="translate(4, 4)">
    <!-- Shield/yard icon representing customer protection -->
    <path d="M20 2L4 9v9c0 8.4 6.8 16.3 16 18 9.2-1.7 16-9.6 16-18V9L20 2z" fill="#FD4F00"/>
    <!-- Person silhouette inside shield -->
    <circle cx="20" cy="15" r="4" fill="white"/>
    <path d="M13 27c0-3.9 3.1-7 7-7s7 3.1 7 7" fill="white" opacity="0.9"/>
    <!-- Checkmark overlay -->
    <path d="M15 22l3 3 7-7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Wordmark (light text for dark backgrounds) -->
  <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F4F5" letter-spacing="-0.5">
    Cust<tspan fill="#FD4F00">yard</tspan>
  </text>
</svg>
