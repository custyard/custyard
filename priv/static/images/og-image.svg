<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Open Graph Social Preview Image - 1200x630 -->
  <!-- Background -->
  <rect width="1200" height="630" fill="#18181B"/>
  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#FD4F00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#18181B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  <!-- Shield icon (large, centered-left) -->
  <g transform="translate(340, 140) scale(3.5)">
    <path d="M20 2L4 9v9c0 8.4 6.8 16.3 16 18 9.2-1.7 16-9.6 16-18V9L20 2z" fill="#FD4F00"/>
    <circle cx="20" cy="15" r="4" fill="white"/>
    <path d="M13 27c0-3.9 3.1-7 7-7s7 3.1 7 7" fill="white" opacity="0.9"/>
    <path d="M15 22l3 3 7-7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="600" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F4F4F5" letter-spacing="-1">
    Cust<tspan fill="#FD4F00">yard</tspan>
  </text>
  <!-- Tagline -->
  <text x="600" y="490" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#A1A1AA" letter-spacing="0.5">
    Customer service and support platform
  </text>
  <!-- Bottom accent bar -->
  <rect x="0" y="618" width="1200" height="12" fill="#FD4F00"/>
</svg>
