# Local container testing / deployment reference
# Usage: docker compose up --build
#
# The boot report and /operator/system name the image build. Compose cannot
# run git, so pass the values in when you want them (otherwise "unknown"):
#   GIT_SHA=$(git rev-parse HEAD) BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker compose up --build
services:
  custyard:
    build:
      context: .
      dockerfile: Containerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "4000:4000"
    volumes:
      - custyard-data:/data
    # Empty on purpose: `docker compose up` with no edits boots into the doctor
    # card at http://localhost:4000, which lists what to set. A new install
    # needs these five (SQLite lives on the volume; no database variables):
    environment: {}
      # SECRET_KEY_BASE: "mix phx.gen.secret"
      # PHX_HOST: localhost
      # First super_admin, created on boot if absent; remove after first login.
      # OPERATOR_EMAIL: you@example.com
      # MAIL_ADAPTER: lettermint   # or smtp|postmark|sendgrid|mailgun
      # LETTERMINT_PROJECT_TOKEN: ""
    restart: unless-stopped
    healthcheck:
      # Liveness only: the container stays up in doctor mode to serve the card.
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-4000}/api/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  custyard-data:
