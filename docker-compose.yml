# Local container testing / deployment reference
# Usage: docker compose up --build
services:
  custyard:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "4000:4000"
    volumes:
      - custyard-data:/data
    environment:
      PHX_HOST: localhost
      PORT: "4000"
      DATABASE_PATH: /data/custyard.db
      # SECRET_KEY_BASE: "generate-with-mix-phx.gen.secret"
      # First super_admin, created on boot if absent; remove after first login.
      # OPERATOR_EMAIL: you@example.com
      # MAIL_ADAPTER: smtp
      # LMTP_ENABLED: "false"
      # CREDENTIAL_ENCRYPTION_KEY: "openssl rand -base64 32" (IMAP channels)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-4000}/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  custyard-data:
