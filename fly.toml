# See https://fly.io/docs/reference/configuration/ for information about this file.

app = "custyard"
org = "custyard"
primary_region = "ams"

[build]
dockerfile = "Containerfile"

[env]
IMAP_ENABLED = "false"
IMAP_FOLDER = "INBOX"
IMAP_HOST = "imap.example.com"
IMAP_POLL_INTERVAL = "60000"
IMAP_PORT = "993"
IMAP_SSL = "true"
LETTERMINT_BASE_URL = "https://api.lettermint.co/v1"
LMTP_ENABLED = "false"
LMTP_HOSTNAME = "localhost"
LMTP_PORT = "2024"
MAIL_ADAPTER = "lettermint"
PHX_HOST = "custyard.fly.dev"

[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
type = "connections"
hard_limit = 200
soft_limit = 150

[[vm]]
size = "shared-cpu-1x"
# 1GB for BEAM VM (~100MB baseline) + LMTP/IMAP (email parsing up to 25MB),
# scoring recalculator batch processing, and LiveView connections
memory = "1gb"

# Not needed when using Turso
# [mounts]
# source = "custyard_data"
# destination = "/data"

[checks]
[checks.health]
port = 4000
type = "http"
interval = "10s"
timeout = "2s"
grace_period = "30s"
method = "GET"
path = "/api/health"
