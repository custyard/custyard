# A separate app until production has moved off Fly. Provision this app and its
# own volume explicitly; these settings do not repurpose the live custyard app.
# Deploy a CI-verified digest with:
# fly deploy --config fly.staging.toml --app custyard-staging --image ghcr.io/custyard/custyard@sha256:<digest>
app = "custyard-staging"
org = "custyard"
primary_region = "ams"

[env]
PHX_HOST = "staging.custyard.com"
PORT = "4000"
STORAGE_PROVIDER = "fly"
PROXY_PROVIDER = "fly"
DATABASE_PROVIDER = "bunny"
UPLOAD_DIR = "/data/uploads"
ATTACHMENT_DIR = "/data/attachments"
MAIL_ADAPTER = "lettermint"
EMAIL_FROM_ADDRESS = "staging@custyard.com"
EMAIL_FROM_NAME = "Custyard Staging"
EMAIL_NOTIFICATIONS_ENABLED = "false"
ACKNOWLEDGMENTS_ENABLED = "false"
LMTP_ENABLED = "false"
SENTRY_ENVIRONMENT = "staging"

[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
type = "connections"
hard_limit = 200
soft_limit = 150

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"

[mounts]
source = "custyard_staging_data"
destination = "/data"

[checks.health]
port = 4000
type = "http"
interval = "10s"
timeout = "2s"
grace_period = "60s"
method = "GET"
path = "/api/health"
