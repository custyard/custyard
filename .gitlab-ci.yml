# Inputs for "Run pipeline". They default to a normal CI run; choosing a
# promote_environment runs only the promotion jobs at the end of this file.
# Translated from .github/workflows/promote.yml (workflow_dispatch inputs).
spec:
  inputs:
    promote_environment:
      description: Promote a published image instead of running CI. none runs the normal pipeline.
      options: [none, staging, production]
      default: none
    image_digest:
      description: Published image digest (sha256 followed by 64 lowercase hex characters).
      default: ""
      regex: ^(sha256:[0-9a-f]{64})?$
    source_sha:
      description: Full source commit SHA from a successful main CI pipeline.
      default: ""
      regex: ^([0-9a-f]{40})?$
    previous_digest:
      description: Current production digest, for rollback and stale-target protection (required for production).
      default: ""
      regex: ^(sha256:[0-9a-f]{64})?$
    acceptance_record:
      description: HTTPS link to acceptance of this exact staged digest (required for production).
      default: ""
      regex: '^(https://[^\s"''<>()$?#]+)?$'
---
# Translated from .github/workflows/ci.yml.
#
# Triggers match the GitHub workflow: merge requests against any target
# branch (stacked MRs included), pushes to the default branch, scheduled
# pipelines (configure under Build > Pipeline schedules, daily 05:23 UTC) and
# manual runs (Build > Pipelines > Run pipeline, or the API). Plain branch
# pushes without an MR do not run a pipeline, as on GitHub. Pushing a
# protected version tag (v1.2.3) runs only image-tag.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
  auto_cancel:
    on_new_commit: interruptible

stages:
  - test
  - build
  - publish
  - promote
  - deploy

variables:
  PROMOTE_ENVIRONMENT: $[[ inputs.promote_environment ]]
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.3"
  OTP_VERSION: "27.2.4"
  # Exact Elixir/OTP pair, the pin erlef/setup-beam gave the GitHub jobs.
  # Same Debian release as the Containerfile's build and runtime stages.
  ELIXIR_IMAGE: hexpm/elixir:1.18.3-erlang-27.2.4-debian-trixie-20260610
  LIBSQL_URL: libsql://libsql:8080?tls=0

.mix-cache: &mix-cache
  key:
    files: [mix.lock]
    # NIFs in _build/ are linked against the image's libc and OpenSSL.
    prefix: mix-$MIX_ENV-$ELIXIR_VERSION-$OTP_VERSION-trixie
  paths: [deps/, _build/]

.libsql-service: &libsql-service
  # latest as of 2026-11-11, pinned by digest.
  name: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
  alias: libsql

# Jobs for normal CI runs: not promotions, and not version-tag pipelines,
# which only tag an image main CI already tested and published.
.ci-only:
  rules:
    - if: $PROMOTE_ENVIRONMENT != "none"
      when: never
    - if: $CI_COMMIT_TAG
      when: never

.not-scheduled:
  rules:
    - !reference [.ci-only, rules]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.elixir:
  image: $ELIXIR_IMAGE
  interruptible: true
  needs: []
  # The image runs as root, which ignores file permissions (a read-only upload
  # directory stays writable) and which bin/doctor refuses. GitHub runners run
  # as an unprivileged user, so the job does too: as_user runs a command as ci.
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends build-essential ca-certificates curl git openssl >/dev/null
    - useradd --create-home ci
    - chown -R ci:ci "$CI_PROJECT_DIR"
    - as_user() { runuser -u ci -- "$@"; }
    - as_user mix local.hex --force
    - as_user mix local.rebar --force
  rules:
    - !reference [.ci-only, rules]
    - when: on_success
  cache:
    - *mix-cache

test:
  extends: .elixir
  stage: test
  rules: !reference [.not-scheduled, rules]
  services:
    - name: rabbitmq:4.2
      alias: rabbitmq
      variables:
        RABBITMQ_DEFAULT_USER: custyard_test
        RABBITMQ_DEFAULT_PASS: custyard_test
        # The runner waits for this port before starting the script.
        HEALTHCHECK_TCP_PORT: "5672"
  variables:
    ACKNOWLEDGMENTS_TEST_AMQP_URL: amqp://custyard_test:custyard_test@rabbitmq:5672
  script:
    - as_user mix deps.get
    - as_user mix compile --warnings-as-errors
    - as_user mix format --check-formatted
    - as_user mix test
    - as_user mix credo --strict

promotion-scripts:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: []
  rules: !reference [.not-scheduled, rules]
  script:
    - python3 -m unittest discover -s .gitlab/scripts -p '*_test.py'

# The suite again over the Turso driver (Custyard.Turso.Connection, Hrana
# over HTTP) against a real libSQL server, the server Turso runs. One test
# at a time: each keeps its sandbox transaction open on a stream for its
# whole run, and how the server arbitrates SQLite's write lock between
# streams is not what this job tests.
turso:
  extends: .elixir
  stage: test
  rules: !reference [.not-scheduled, rules]
  parallel:
    matrix:
      - TURSO_TEST_PROVIDER: [turso, bunny]
  services:
    - *libsql-service
  variables:
    TURSO_TEST_URL: $LIBSQL_URL
  cache:
    - <<: *mix-cache
      policy: pull
  script:
    - as_user mix deps.get
    - |
      for _ in $(seq 1 30); do
        curl -fsS http://libsql:8080/health && break
        sleep 1
      done
      curl -fsS http://libsql:8080/health
    - as_user mix test --max-cases 1

# Builds the prod release and runs Custyard.Release tasks through
# `bin/custyard eval` against a running server, which `mix test` cannot
# exercise: there the application is already started.
release:
  extends: .elixir
  stage: test
  timeout: 15m
  services:
    - *libsql-service
  variables:
    MIX_ENV: prod
  script:
    - as_user mix deps.get --only prod
    - as_user mix release --overwrite
    - as_user bin/release-smoke-test
    # Release smoke test on a libSQL server.
    - as_user env DATABASE_URL="$LIBSQL_URL" bin/release-smoke-test

security:
  extends: .elixir
  stage: test
  cache:
    - <<: *mix-cache
      policy: pull
  script:
    - as_user mix deps.get
    - as_user mix sobelow --exit
    - as_user mix hex.audit
    - as_user mix deps.audit

.docker:
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
    BUILD_CACHE: $CI_REGISTRY_IMAGE:buildcache
  before_script:
    - apk add --no-cache bash coreutils curl
    # buildx cannot build from the TLS env vars directly; wrap them in a context.
    - docker context create dind
    - docker buildx create --use --driver docker-container dind
    - BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

# Validate the deployable image on MRs and manual runs. Pushes to the default
# branch build it in publish, after all application checks succeed. No
# registry login here: the job reads the public build cache anonymously and
# cannot write the cache that publish builds from.
container:
  extends: .docker
  stage: build
  interruptible: true
  needs: []
  timeout: 30m
  rules:
    - !reference [.ci-only, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/
  script:
    - >-
      docker buildx build --file Containerfile --platform linux/amd64 --load
      --build-arg GIT_SHA="$CI_COMMIT_SHA" --build-arg BUILD_TIME="$BUILD_TIME"
      --cache-from type=registry,ref="$BUILD_CACHE"
      --tag custyard:test .
    - bin/container-smoke-test custyard:test

publish:
  extends: .docker
  stage: publish
  needs: [test, turso, release, security]
  timeout: 30m
  rules:
    - !reference [.ci-only, rules]
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_PATH == "custyard/custyard"
  variables:
    IMAGE: $CI_REGISTRY_IMAGE
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >-
      docker buildx build --file Containerfile --platform linux/amd64 --push
      --metadata-file build-metadata.json
      --build-arg GIT_SHA="$CI_COMMIT_SHA" --build-arg BUILD_TIME="$BUILD_TIME"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --cache-from type=registry,ref="$BUILD_CACHE"
      --cache-to type=registry,ref="$BUILD_CACHE",mode=max
      --tag "$IMAGE:sha-$CI_COMMIT_SHA" .
    - |
      DIGEST=$(grep -o '"containerimage.digest": *"[^"]*"' build-metadata.json | grep -o 'sha256:[0-9a-f]*')
      echo "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "Build did not return an immutable digest" >&2; exit 1; }
    - >-
      printf '{"digest": "%s", "image": "%s", "job_id": %s, "pipeline_id": %s, "repository": "%s", "source_sha": "%s", "version": 1}\n'
      "$DIGEST" "$IMAGE" "$CI_JOB_ID" "$CI_PIPELINE_ID" "$CI_PROJECT_PATH" "$CI_COMMIT_SHA" > published-image.json
    - cat published-image.json
    - |
      printf 'Published: %s:sha-%s\nDeploy by digest: %s@%s\n' "$IMAGE" "$CI_COMMIT_SHA" "$IMAGE" "$DIGEST"
  artifacts:
    name: published-image-$CI_PIPELINE_ID
    paths: [published-image.json]
    expire_in: 90 days

# Pushing a protected version tag (v1.2.3) gives the image main CI published
# for that commit a version tag. Nothing is rebuilt. image_tag.py takes the
# digest from the publish record of a successful push-to-main pipeline, as
# promotion does, and never from the sha-<commit> registry tag, which anyone
# who can write the registry can repoint. It checks the image's revision and
# source labels and never moves an existing version tag. The rule needs v*
# to be a protected tag (Settings > Repository > Protected tags, Maintainers);
# until it is, a version tag starts no pipeline. See
# docs/ops/container-publishing.md.
image-tag:
  stage: publish
  image: python:3.12-slim
  interruptible: false
  needs: []
  # One at a time: the existing-tag check and the write are separate requests.
  resource_group: custyard-image-tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_PATH == "custyard/custyard"
  script:
    # A tag pipeline runs no other job, so the scripts are tested here first.
    - python3 -m unittest discover -s .gitlab/scripts -p '*_test.py'
    - python3 .gitlab/scripts/image_tag.py

# Promotion: translated from .github/workflows/promote.yml. Run pipeline on
# main with promote_environment set. promote:validate checks the candidate
# against a successful push-to-main pipeline, its publish record and registry
# metadata. Each deploy job repeats those checks on the digest it deploys,
# since job and pipeline variables outrank inputs and dotenv values. Staging
# deploys automatically; production waits for a person to start
# promote:production (GitLab Free has no deployment approvals). Deploy
# credentials are protected, environment-scoped CI/CD variables. See
# docs/ops/bunny-setup.md.
.promotion:
  image: python:3.12-slim
  interruptible: false
  variables:
    # Validated again by promotion.py; expand: false keeps a $ literal.
    IMAGE_DIGEST:
      value: $[[ inputs.image_digest ]]
      expand: false
    SOURCE_SHA:
      value: $[[ inputs.source_sha ]]
      expand: false
    PREVIOUS_DIGEST:
      value: $[[ inputs.previous_digest ]]
      expand: false
    ACCEPTANCE_RECORD:
      value: $[[ inputs.acceptance_record ]]
      expand: false
  rules:
    - !reference [.promotion-guard, rules]
    - when: on_success

# Promotion jobs exist only in a manual pipeline on protected main.
.promotion-guard:
  rules:
    - if: $PROMOTE_ENVIRONMENT == "none"
      when: never
    - if: $CI_PIPELINE_SOURCE !~ /^(web|api)$/
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED != "true"
      when: never
    - if: $CI_PROJECT_PATH != "custyard/custyard"
      when: never

# Fails loudly instead of creating an empty pipeline when promotion is
# requested anywhere but a manual pipeline on protected main.
promote:rejected:
  stage: promote
  image: python:3.12-slim
  rules:
    - if: $PROMOTE_ENVIRONMENT == "none"
      when: never
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PROJECT_PATH == "custyard/custyard"
      when: never
    - when: on_success
  script:
    - echo "Promotion rejected - run it from Build > Pipelines > Run pipeline on main" >&2
    - exit 1

promote:validate:
  extends: .promotion
  stage: promote
  needs: []
  environment:
    name: $[[ inputs.promote_environment ]]
    action: prepare
  script:
    - python3 -m unittest discover -s .gitlab/scripts -p '*_test.py'
    - python3 .gitlab/scripts/promotion.py validate
  artifacts:
    reports:
      dotenv: promotion.env

promote:staging:
  extends: .promotion
  stage: deploy
  needs: [promote:validate]
  resource_group: custyard-promotion-staging
  environment:
    name: staging
    url: $ENVIRONMENT_URL
  rules:
    - if: $PROMOTE_ENVIRONMENT != "staging"
      when: never
    - !reference [.promotion, rules]
  variables:
    FLYCTL_VERSION: 0.5.4
    FLYCTL_SHA256: 0e58776a99e561887b82b941b15b63fd8fb1c7153b567b11fb3e63b65dd9780e
  script:
    - |
      python3 -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], "flyctl.tar.gz")' \
        "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
      echo "$FLYCTL_SHA256  flyctl.tar.gz" | sha256sum -c -
      tar -xzf flyctl.tar.gz flyctl
    # Revalidates the digest, then deploys it; the registry is public, so Fly
    # pulls the verified digest directly.
    - python3 .gitlab/scripts/promotion.py deploy-staging
    - python3 .gitlab/scripts/promotion.py wait-healthy
    - echo "ENVIRONMENT_URL=$ENVIRONMENT_URL" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

promote:production:
  extends: .promotion
  stage: deploy
  needs: [promote:validate]
  resource_group: custyard-promotion-production
  environment:
    name: production
    url: $ENVIRONMENT_URL
  rules:
    - if: $PROMOTE_ENVIRONMENT != "production"
      when: never
    - !reference [.promotion-guard, rules]
    - when: manual
      allow_failure: false
  script:
    - python3 .gitlab/scripts/promotion.py update-bunny
    - python3 .gitlab/scripts/promotion.py verify-bunny
    - python3 .gitlab/scripts/promotion.py wait-healthy
    - echo "ENVIRONMENT_URL=$ENVIRONMENT_URL" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
