# .github/workflows/claude-code-review.yml

name: Claude Code Review

on:
  pull_request:
    branches:
      - 'feature/*'
      - 'fix/*'
      - 'wip/*'
      - 'develop'
      - 'main'
    types: [opened, synchronize, labeled]
  workflow_dispatch:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Skip bot PRs, trigger on: new PRs, label added, or sync with label present
    if: ${{
      !endsWith(github.actor, '[bot]') &&
      (
        (github.event.action == 'opened') ||
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'claude-review'))
      )
      }}

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-opus-4-5

          direct_prompt: |
            Please review this pull request for a Phoenix/Elixir project. Focus on:
            - Code quality and Elixir/Phoenix best practices
            - Potential bugs or issues
            - LiveView patterns and real-time considerations
            - Ecto queries and database concerns
            - Security concerns (especially with user input)
            - Test coverage

            Be constructive and helpful in your feedback.

          use_sticky_comment: true

      - name: Remove claude-review label
        if: always() && github.event.action != 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'claude-review'
              });
            } catch (error) {
              console.log('Label not found or already removed');
            }
