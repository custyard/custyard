name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are intentionally skipped; forks and Dependabot cannot use this secret.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Test review completion guard
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run Claude Code Review
        id: claude-review
        # Claude's app requires this workflow to match main. A workflow change
        # intentionally fails the completion guard until merged and run on another PR.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Perform a code review of https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            at head commit ${{ github.event.pull_request.head.sha }}.

            This workflow requests a review of every new head, including workflow changes.
            Do the review directly. Do not invoke a review skill or skip because the PR
            looks trivial or already has comments. Earlier reviews are context only.
            Never treat an inability to inspect the PR or use a required tool as a clean review.

            Read the PR description, changed-file list and diff, then inspect relevant
            implementations, callers and tests. For large changes, delegate independent
            reviews by concern and consolidate their validated findings. Focus on bugs,
            security boundaries, regressions and missing tests for changed behavior.
            Exclude style preferences, speculative findings and pre-existing defects.

            Use gh pr view/diff and read-only gh api GET requests to inspect GitHub.
            The checkout contains the PR merge commit. Do not execute application code,
            tests or scripts from the PR; this is a static review.
            Do not modify repository files or PR metadata. Use Read, Glob and Grep for
            local file inspection, and use literal commands without shell probes,
            pipelines or environment-variable substitutions. Tell delegated agents the same.

            Post validated findings as inline comments using
            mcp__github_inline_comment__create_inline_comment with confirmed: true,
            linking to the full head SHA and explaining the trigger and impact.
            Consolidate duplicates, including issues already reported by other reviewers.

            After the entire review finishes, always use gh pr comment to post a
            "Claude code review" completion summary containing the reviewed head SHA,
            a short summary of findings (or an explicit statement that no issues were found).
            Include this exact marker on its own line:
            <!-- claude-review:${{ github.event.pull_request.head.sha }}:${{ github.run_id }}:${{ github.run_attempt }} -->
            Only post this marker after completing the review. If blocked, explain the
            blocker in your final response and do not post the completion marker.
            Return the required structured result: review_completed is true only after
            the review and summary publication succeed; otherwise choose a blocking_reason.
          claude_args: >-
            --allowedTools "Agent,Read,Glob,Grep,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh api *),Bash(gh issue view *),Bash(gh search *),Bash(gh issue list *),Bash(gh pr comment *),Bash(gh pr diff *),Bash(gh pr view *),Bash(gh pr list *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git ls-files *),Bash(git rev-parse *)"
            --json-schema '{"type":"object","properties":{"review_completed":{"type":"boolean"},"reviewed_head_sha":{"const":"${{ github.event.pull_request.head.sha }}"},"blocking_reason":{"enum":["none","permission_denied","github_access","usage_limit","review_not_finished","publication_failed"]}},"required":["review_completed","reviewed_head_sha","blocking_reason"],"additionalProperties":false}'

      - name: Verify review completed and was published
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: python3 -B .github/scripts/verify_claude_review.py

