name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Test review guards
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Partition every changed file into bounded reviews
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PLAN_DIR: ${{ runner.temp }}/claude-review-plan
        run: python3 -B .github/scripts/verify_claude_review.py plan
      - uses: actions/upload-artifact@v7
        with:
          name: claude-review-plan
          path: ${{ runner.temp }}/claude-review-plan
          retention-days: 3
          if-no-files-found: error

  review:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      REVIEW_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: claude-review-plan
          path: ${{ runner.temp }}/claude-review-plan
      - name: Review assigned files with Claude
        id: claude
        # Anthropic requires this workflow to match main before it can run.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Perform a static code review of ONLY the files assigned in
            ${{ runner.temp }}/claude-review-plan/shard-${{ matrix.shard }}.json.
            Read that file first. It contains the repository, PR, head SHA, description,
            assigned paths and their patches. Do not fetch or attempt the entire PR diff.
            The checkout contains the PR merge commit. Inspect assigned source files,
            relevant callers and tests using Read, Glob and Grep. Read missing/truncated
            patches through a targeted GitHub API GET or git show, never the whole diff.

            Review every assigned file. Focus on confirmed bugs, security boundaries,
            regressions and missing tests for changed behavior. Exclude pre-existing
            defects, style preferences and speculative findings. Earlier PR feedback is
            context: consolidate duplicates and do not post an issue already reported.
            Do not skip because files look trivial or already have comments. Do not
            execute application code, tests or scripts, modify files or PR metadata,
            invoke review skills, or use shell probes, pipelines or substitutions.

            Post validated new findings with mcp__github_inline_comment__create_inline_comment
            using confirmed: true, the full head SHA and a clear trigger and impact.
            Do not post a top-level summary; the workflow publishes one combined report.
            Return the structured result. reviewed_files must list exactly the assigned
            paths you actually reviewed. Set review_completed true and blocking_reason
            none only after all assigned files are reviewed. Otherwise report an explicit
            blocker and incomplete coverage. Include a concise summary of findings or
            state that no additional issues were found. A partial pass is not complete.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh api *),Bash(gh pr view *),Bash(git diff *),Bash(git show *),Bash(git log *),Bash(git rev-parse *)"
            --json-schema '{"type":"object","properties":{"review_completed":{"type":"boolean"},"reviewed_head_sha":{"const":"${{ github.event.pull_request.head.sha }}"},"reviewed_files":{"type":"array","items":{"type":"string"},"uniqueItems":true,"minItems":1},"summary":{"type":"string","minLength":1,"maxLength":3000},"blocking_reason":{"enum":["none","permission_denied","github_access","usage_limit","review_not_finished","publication_failed"]}},"required":["review_completed","reviewed_head_sha","reviewed_files","summary","blocking_reason"],"additionalProperties":false}'
      - name: Verify assigned-file coverage and retain safe result
        if: always()
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          REVIEW_PLAN_DIR: ${{ runner.temp }}/claude-review-plan
          REVIEW_RESULT_DIR: ${{ runner.temp }}/claude-review-results
        run: python3 -B .github/scripts/verify_claude_review.py shard
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: claude-review-result-${{ matrix.shard }}
          path: ${{ runner.temp }}/claude-review-results
          retention-days: 3
          if-no-files-found: error

  claude-review:
    needs: [plan, review]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fail visibly when review planning did not complete
        if: needs.plan.result != 'success'
        run: |
          echo '::error::Claude review incomplete: planning did not finish successfully.'
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: claude-review-plan
          path: ${{ runner.temp }}/claude-review-plan
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: claude-review-result-*
          path: ${{ runner.temp }}/claude-review-results
          merge-multiple: true
      - name: Verify complete coverage and publish combined Claude review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PLAN_DIR: ${{ runner.temp }}/claude-review-plan
          REVIEW_RESULT_DIR: ${{ runner.temp }}/claude-review-results
          REVIEW_JOBS_RESULT: ${{ needs.review.result }}
        run: python3 -B .github/scripts/verify_claude_review.py publish
